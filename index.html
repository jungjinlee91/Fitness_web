<div class="app"><div class="topbar"><div class="brand">MY FITNESS ARCHIVE <span style="color:#5e6a65;font-weight:500;letter-spacing:.08em">v5.8</span></div><div class="top-actions"><button class="pill" id="todayBtn">이번 달</button><button class="round" id="settingsBtn" aria-label="설정">⋯</button><button class="round mint" id="addBtn" aria-label="운동 추가">＋</button></div></div>

<section id="firstRun" class="first-run hidden"><h3>개인 운동 데이터 불러오기</h3><p>GitHub에는 앱 화면만 있습니다. 아이폰에 보관한 <b>fitness_data.json</b>을 처음 한 번 선택하면 기록과 GPS 경로가 이 Safari에만 저장됩니다.</p><button id="firstImport">fitness_data.json 선택</button></section><section><div class="history-head"><div><div class="section-kicker">ACTIVITY LOG</div><h2 id="historyTitle"></h2></div><div class="total" id="eventCount"></div></div><div id="history" class="history"></div></section></div>
<div id="overlay" class="overlay hidden"></div>

<section id="settingsSheet" class="sheet hidden"><div class="grab"></div><div class="sheet-head"><div><div class="sheet-date">PRIVATE DATA</div><h3>데이터 관리</h3></div><button class="close" data-close>×</button></div><div class="settings-list"><button class="settings-btn" id="exportHtml"><strong>개인 데이터 JSON 백업</strong><span>현재 운동 기록과 GPS 경로를 iCloud Drive 등에 백업합니다.</span></button><button class="settings-btn" id="importJson"><strong>fitness_data.json 불러오기</strong><span>처음 한 번 개인 운동 데이터 파일을 선택하면 이 Safari에 저장됩니다.</span></button><button class="settings-btn" id="resetData"><strong>이 기기의 운동 데이터 삭제</strong><span>Safari에 저장된 운동 기록과 GPS 경로를 삭제합니다.</span></button></div><div class="status" id="storageStatus"></div><input id="fileInput" type="file" accept="application/json,.json" class="hidden"></section>

      body+='<div class="detail-section"><h4>GPS ROUTE</h4><div class="route-card"><div class="route-note">GPS 기록은 있으나 이 통합 이벤트와 경로 자동매칭되지 않음</div></div></div>';
    }
    if(e.note)body+='<div class="detail-section"><h4>MY NOTE</h4><div class="note">'+esc(e.note)+'</div></div>';
    if(e.insta)body+='<div class="detail-section"><h4>INSTAGRAM NOTE</h4><div class="insta">'+esc(e.insta)+'</div></div>';
    detailBody.innerHTML=body;
  }catch(err){
    console.error('openDetail render error',err);
    detailBody.innerHTML='<div style="padding:24px 0;color:#ff9a9a;line-height:1.6">상세 정보 일부를 표시하지 못했습니다.<br><small>'+esc(err&&err.message?err.message:String(err))+'</small></div>';
  }
}
function showSheet(el){
  if(!el){showToast('상세 화면 요소를 찾지 못했습니다');return}
  document.querySelectorAll('.sheet').forEach(function(x){x.classList.add('hidden')});
  if(overlay)overlay.classList.remove('hidden');
  el.classList.remove('hidden');
  el.scrollTop=0;
  document.body.style.overflow='hidden';
}function closeSheets(){let returnToCalendar=sheetFromCalendar;if(overlay)overlay.classList.add('hidden');document.querySelectorAll('.sheet').forEach(function(x){x.classList.add('hidden')});document.body.style.overflow='';activeEventId=null;editingId=null;sheetFromCalendar=false;sheetAnchorDate=null;if(returnToCalendar)setTimeout(scrollCalendarHome,25)}
function fillTypes(){fType.innerHTML=TYPES.map(t=>`<option value="${t}">${t}</option>`).join('')}function toggleFields(){let climb=fType.value==='클라이밍';document.querySelectorAll('.climb-only').forEach(x=>x.classList.toggle('hidden',!climb));document.querySelectorAll('.non-climb').forEach(x=>x.classList.toggle('hidden',climb))}
function openEditor(id=null){editingId=id;let e=id?EVENTS.find(x=>x.id===id):{date:isoToday(),type:'헬스/웨이트',title:'헬스/웨이트',start:'',end:'',minutes:null,kcal:null,distance:null,avgHr:null,maxHr:null,gymBrand:'',gymBranch:'',grades:[],note:''};editTitle.textContent=id?'운동 편집':'운동 추가';editKicker.textContent=id?'ACTIVITY EDITOR':'NEW ACTIVITY';deleteBtn.classList.toggle('hidden',!id);fDate.value=e.date||isoToday();fType.value=normalizeType(e.type||'헬스/웨이트');fTitle.value=e.title||'';fStart.value=e.start||'';fEnd.value=e.end||'';fMinutes.value=e.minutes??'';fKcal.value=e.kcal??'';fDistance.value=e.distance??'';fAvgHr.value=e.avgHr??'';fMaxHr.value=e.maxHr??'';fGymBrand.value=e.gymBrand||'';fGymBranch.value=e.gymBranch||'';fGrades.value=(e.grades||[]).join(' ');fNote.value=e.note||'';toggleFields();showSheet(editSheet)}
function makeId(){return 'USR'+Date.now().toString(36).toUpperCase()}function saveForm(ev){ev.preventDefault();let old=editingId?EVENTS.find(x=>x.id===editingId):null,date=fDate.value,type=normalizeType(fType.value),obj=old?{...old}:{id:makeId(),source:'Manual',merge:'',review:false,gps:false,health:'',insta:'',grades:[]};obj.date=date;obj.month=date.slice(0,7);obj.weekday=weekday(date);obj.type=type;obj.title=fTitle.value.trim()||type;obj.start=fStart.value;obj.end=fEnd.value;obj.minutes=num(fMinutes.value);obj.kcal=type==='클라이밍'?null:num(fKcal.value);obj.distance=type==='클라이밍'?null:num(fDistance.value);obj.avgHr=type==='클라이밍'?null:num(fAvgHr.value);obj.maxHr=type==='클라이밍'?null:num(fMaxHr.value);obj.gymBrand=type==='클라이밍'?fGymBrand.value.trim():'';obj.gymBranch=type==='클라이밍'?fGymBranch.value.trim():'';obj.grades=type==='클라이밍'?fGrades.value.split(/[\s,]+/).map(x=>x.trim()).filter(Boolean):[];obj.note=fNote.value.trim();if(old){EVENTS[EVENTS.findIndex(x=>x.id===old.id)]=obj}else EVENTS.push(obj);saveLocal();current=new Date(+date.slice(0,4),+date.slice(5,7)-1,1);selected=date;render();closeSheets();showToast('저장했습니다')}
function deleteEvent(){if(!editingId)return;if(!confirm('이 운동 기록을 삭제할까요?'))return;EVENTS=EVENTS.filter(e=>e.id!==editingId);saveLocal();render();closeSheets();showToast('삭제했습니다')}
function isoToday(){let d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}function showToast(msg){let t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(showToast._t);showToast._t=setTimeout(()=>t.classList.remove('show'),1700)}
function downloadBlob(content,name,type){let blob=new Blob([content],{type}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},800)}
function exportJson(){let payload={schema:2,exportedAt:new Date().toISOString(),events:EVENTS,routes:ROUTES};downloadBlob(JSON.stringify(payload,null,2),`fitness_backup_${isoToday()}.json`,'application/json;charset=utf-8');showToast('개인 데이터 백업을 만들었습니다')}
function exportHtml(){let copy=document.documentElement.cloneNode(true),safe=JSON.stringify(EVENTS).replace(/&/g,'\\u0026').replace(/</g,'\\u003c').replace(/>/g,'\\u003e');copy.dataset.instance='snap-'+Date.now();copy.querySelector('#baseData').textContent=safe;copy.querySelector('#overlay').classList.add('hidden');copy.querySelectorAll('.sheet').forEach(x=>x.classList.add('hidden'));copy.querySelector('body').style.overflow='';let out='<!doctype html>\n'+copy.outerHTML;downloadBlob(out,`fitness_archive_${isoToday()}.html`,'text/html;charset=utf-8');showToast('수정사항을 포함한 HTML을 만들었습니다')}
async function importJsonFile(file){
  if(!file)return;
  let p;
  try{
    let text;
    if(typeof file.text==='function') text=await file.text();
    else text=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('파일 읽기 실패'));r.readAsText(file)});
    text=String(text).replace(/^\uFEFF/,'').trim();
    p=JSON.parse(text);
  }catch(e){
    alert(`JSON 파일을 읽지 못했습니다.\n\n파일: ${file.name}\n오류: ${e?.message||e}`);
    return;
  }
  let arr=Array.isArray(p)?p:(p&&Array.isArray(p.events)?p.events:(p?.data&&Array.isArray(p.data.events)?p.data.events:null));
  if(!Array.isArray(arr)){
    alert('JSON은 열렸지만 운동 기록(events) 배열을 찾지 못했습니다.');
    return;
  }
  try{
    EVENTS=arr.map((e,i)=>{
      if(!e||typeof e!=='object')throw new Error(`${i+1}번째 운동 기록 형식 오류`);
      let x={...e};
      if(typeof x.date!=='string'||x.date.length<10)throw new Error(`${i+1}번째 운동의 날짜 형식 오류`);
      x.month=x.month||x.date.slice(0,7);
      x.id=x.id||('IMP'+i+'_'+x.date.replaceAll('-',''));
      x.type=normalizeType(x.type||'기타');
      if((x.title==='하이킹/등산'||x.title==='트레킹'||x.title==='하이킹'||x.title==='등산')&&x.type==='등산/트레킹')x.title='등산/트레킹';
      x.grades=Array.isArray(x.grades)?x.grades:[];
      return x;
    });
    ROUTES=(p&&p.routes&&typeof p.routes==='object'&&!Array.isArray(p.routes))?p.routes:{};
    saveLocal();
    let latest=EVENTS.reduce((a,e)=>e.date>a?e.date:a,'2026-08-01');
    current=new Date(Number(latest.slice(0,4)),Number(latest.slice(5,7))-1,1);
    selected=null;
    render();
    closeSheets();
    showToast(`${EVENTS.length.toLocaleString()}개 운동 기록을 불러왔습니다`);
  }catch(e){
    console.error('Import post-processing error',e);
    alert(`운동 데이터는 읽었지만 화면 반영 중 오류가 발생했습니다.\n\n${e?.message||e}`);
  }
}
function resetAll(){if(!confirm('이 아이폰에 저장된 운동 데이터를 모두 삭제할까요? JSON 백업이 없다면 복구할 수 없습니다.'))return;EVENTS=[];ROUTES={};try{localStorage.removeItem(STORAGE_KEY)}catch(e){}render();closeSheets();showToast('이 기기의 운동 데이터를 삭제했습니다')}
function updateStatus(){storageStatus.innerHTML=`<strong>${storageOK?'이 아이폰에 자동 저장 중':'Safari 저장공간을 사용할 수 없음'}</strong><br>${storageOK?'불러온 개인 데이터와 편집 내용은 이 Safari에만 저장됩니다. GitHub에는 업로드되지 않습니다. 가끔 JSON 백업을 iCloud Drive에 저장해 주세요.':'브라우저 저장공간을 사용할 수 없습니다. 편집 후 JSON 백업을 반드시 저장해 주세요.'}<br><br>공개 페이지에는 개인 운동 데이터 없음 · 현재 이 기기에 ${EVENTS.length.toLocaleString()}개 기록`}
prev.onclick=()=>{current=new Date(current.getFullYear(),current.getMonth()-1,1);selected=null;activeFilter=null;render()};next.onclick=()=>{current=new Date(current.getFullYear(),current.getMonth()+1,1);selected=null;activeFilter=null;render()};todayBtn.onclick=()=>{let d=new Date();current=new Date(d.getFullYear(),d.getMonth(),1);selected=null;activeFilter=null;render()};addBtn.onclick=()=>openEditor();settingsBtn.onclick=()=>{updateStatus();showSheet(settingsSheet)};editBtn.onclick=()=>{let id=activeEventId;openEditor(id)};overlay.onclick=closeSheets;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheets);fType.onchange=toggleFields;editForm.onsubmit=saveForm;deleteBtn.onclick=deleteEvent;let exportJsonBtn=document.getElementById('exportJson');if(exportJsonBtn)exportJsonBtn.onclick=exportJson;document.getElementById('exportHtml').onclick=exportHtml;document.getElementById('importJson').onclick=()=>fileInput.click();firstImport.onclick=()=>fileInput.click();fileInput.onchange=async()=>{let f=fileInput.files&&fileInput.files[0];if(f)await importJsonFile(f);fileInput.value=''};document.getElementById('resetData').onclick=resetAll;fillTypes();try{render()}catch(e){console.error('Initial render error',e);alert('초기 화면을 표시하는 중 오류가 발생했습니다.\n\n'+(e?.message||e));}
</script></body></html>
